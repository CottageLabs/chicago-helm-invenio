## Chicago / UChicago deployment values
## Target: uchicago.cottagelabs.com
## Cluster: chicago-invenio (us-east-2)

global:
  timezone: "America/Chicago"

## ECR registry and certificate ARN are in values-uchicago-private.yaml (gitignored).
image:
  repository: chicago-invenio
  tag: "881ebeec9d8d0374c17ba134cb996c9c85356ce0"
  pullPolicy: Always

ingress:
  enabled: true
  class: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/tags: project=chicago-invenio

invenio:
  hostname: uchicago.cottagelabs.com
  init: true
  sysadmin:
    email: sysadmin@cottagelabs.com
    passwordSecret: invenio-sysadmin-secret
  datacite:
    enabled: true
    prefix: "10.6082"
    testMode: true
    existingSecret: invenio-datacite-secret
    secretKeys:
      usernameKey: DATACITE_USERNAME
      passwordKey: DATACITE_PASSWORD
  extraEnvFrom:
    - secretRef:
        name: invenio-mail-secret
    - secretRef:
        name: invenio-oauth-secret

persistence:
  enabled: true
  storage_class: efs
  access_mode: ReadWriteMany
  size: 500G

terminal:
  enabled: true
  replicas: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  extraVolumes:
    - name: import-data-s3
      persistentVolumeClaim:
        claimName: import-data-s3
  extraVolumeMounts:
    - name: import-data-s3
      mountPath: /mnt/import-data


web:
  replicas: 2
  uwsgi:
    processes: 2
    threads: 2

worker:
  replicas: 2
  concurrency: 2

flower:
  enabled: false

postgresql:
  enabled: false

postgresqlExternal:
  port: 5432
  username: invenio
  database: invenio
  existingSecret: invenio-db-secret
  existingSecretPasswordKey: password

redis:
  enabled: false

redisExternal:
  hostname: ""  # set in values-uchicago-private.yaml

rabbitmq:
  enabled: false

rabbitmqExternal:
  hostname: invenio-mq.invenio.svc.cluster.local
  amqpPort: 5672
  managementPort: 15672
  protocol: amqp
  vhost: ""
  username: invenio
  existingSecret: invenio-mq-secret
  existingSecretPasswordKey: password

opensearch:
  enabled: true
