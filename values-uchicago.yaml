## Chicago / UChicago deployment values
## Target: uchicago.cottagelabs.com / knowledge.uchicago.edu
## Cluster: chicago-invenio (us-east-2)

global:
  timezone: "America/Chicago"

## ECR registry and certificate ARN are in values-uchicago-private.yaml (gitignored).
image:
  repository: chicago-invenio
  tag: "6230057838f01bfccc9a832a9a8b9bf3f08be8e4"
  pullPolicy: Always

ingress:
  enabled: true
  class: alb
  extraHosts:
    - uchicago.cottagelabs.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/tags: project=chicago-invenio
    alb.ingress.kubernetes.io/healthcheck-path: /ping

invenio:
  hostname: knowledge.uchicago.edu
  init: true
  sysadmin:
    email: sysadmin@cottagelabs.com
    passwordSecret: invenio-sysadmin-secret
  datacite:
    enabled: true
    prefix: "10.6082"
    testMode: false
    existingSecret: invenio-datacite-secret
    secretKeys:
      usernameKey: DATACITE_USERNAME
      passwordKey: DATACITE_PASSWORD
  extraConfig:
    # uchicago.cottagelabs.com is listed in ingress.extraHosts above.
    INVENIO_TRUSTED_HOSTS: '["knowledge.uchicago.edu", "uchicago.cottagelabs.com"]'
    # Take the client IP from X-Forwarded-For so rate limiting and usage stats
    # see visitors rather than the ALB's private IPs. x_for is the number of
    # trusted proxies that append to the header the app receives: only the ALB
    # (nginx's own X-Forwarded-For uwsgi_param isn't the HTTP header the app
    # reads). Adding CloudFront in front of the ALB makes this 2.
    # x_proto stays 0 so the URL scheme the app sees is unchanged.
    # See docs/setup/aws-cost-reductions.md.
    INVENIO_PROXYFIX_CONFIG: '{"x_for": 1, "x_proto": 0}'
  extraEnvFrom:
    - secretRef:
        name: invenio-mail-secret
    - secretRef:
        name: invenio-oauth-secret
  sentry:
    enabled: true
    existingSecret: invenio-sentry-secret
  ## Recycle a uwsgi worker once its own RSS crosses these thresholds (in MB), so a
  ## worker that balloons during a heavy operation doesn't keep running at that size
  ## indefinitely. Without this, workers only recycle on max-requests (see
  ## uwsgi-configmap.yaml), which has no ceiling on memory between recycles -- this is
  ## what let individual web pods grow past their 4Gi request (to 5.5-7.3Gi observed)
  ## until the node evicted them under memory pressure.
  ## reload-on-rss: graceful, worker finishes its current request first.
  ## evil-reload-on-rss: set higher, as a hard backstop closer to the 8Gi container
  ## limit -- only kicks in if a worker somehow blows past the graceful threshold too.
  uwsgiExtraConfig:
    reload-on-rss: 2048
    evil-reload-on-rss: 3072

persistence:
  enabled: true
  storage_class: efs
  access_mode: ReadWriteMany
  size: 500G

terminal:
  enabled: true
  replicas: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  extraVolumes:
    - name: import-data-s3
      persistentVolumeClaim:
        claimName: import-data-s3
  extraVolumeMounts:
    - name: import-data-s3
      mountPath: /mnt/import-data

web:
  replicas: 4
  autoscaler:
    enabled: true
    scaler_cpu_utilization: 65
    min_web_replicas: 4
    max_web_replicas: 6
  uwsgi:
    processes: 4
    threads: 2
  readinessProbe:
    failureThreshold: 5
    timeoutSeconds: 5
  ## uwsgi takes ~30-36s to load the app in each of its 4 workers (measured
  ## Sept 2026), so the startup probe allows ~110s (10s initial delay +
  ## 20 x 5s period). With 5, pods starting on a busy node were killed before
  ## the app finished loading. Only applies until the first success; an app
  ## that fails to import exits straight away regardless.
  startupProbe:
    failureThreshold: 20
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 6Gi

nginx:
  readinessProbe:
    failureThreshold: 5
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  replicas: 2
  concurrency: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

flower:
  enabled: false

postgresql:
  enabled: false

postgresqlExternal:
  port: 5432
  username: invenio
  database: invenio
  existingSecret: invenio-db-secret
  existingSecretPasswordKey: password

redis:
  enabled: false

redisExternal:
  hostname: ""  # set in values-uchicago-private.yaml

rabbitmq:
  enabled: false

rabbitmqExternal:
  hostname: invenio-mq.invenio.svc.cluster.local
  amqpPort: 5672
  managementPort: 15672
  protocol: amqp
  vhost: ""
  username: invenio
  existingSecret: invenio-mq-secret
  existingSecretPasswordKey: password

opensearch:
  enabled: true
  ## Install repository-s3 at container start, for snapshots to S3.
  ## See docs/setup/aws-backups.md.
  plugins:
    enabled: true
    installList:
      - repository-s3
  ## Dedicated service account, matched by the IRSA role's trust policy.
  rbac:
    create: true
    serviceAccountName: invenio-opensearch
  config:
    opensearch.yml: |
      cluster.name: invenio-opensearch
      network.host: 0.0.0.0
      # FIXME: re-enable security and configure TLS/auth
      plugins:
        security:
          disabled: true
      s3.client.default.region: us-east-2
      # Regional endpoint: the global s3.amazonaws.com endpoint 307-redirects
      # requests for buckets outside us-east-1 until DNS has propagated.
      s3.client.default.endpoint: s3.us-east-2.amazonaws.com
      # Relative to the config dir; see extraVolumeMounts below
      s3.client.default.identity_token_file: aws-irsa/token
  ## A newly started node only becomes Ready once the cluster is green, so a
  ## rolling restart waits for shards to recover before restarting the next
  ## node (the chart default only checks the port is open). After the first
  ## green, the probe only checks that HTTP responds, so a cluster that later
  ## goes yellow doesn't pull every node out of the Service.
  ## Discovery uses the headless service, which includes not-ready pods, so a
  ## waiting node can still join and recover shards.
  ## If a rollout stalls because the cluster can't reach green for an
  ## unrelated reason, see docs/maintenance/opensearch.md.
  readinessProbe:
    # null removes the chart's default tcpSocket check (Helm merges maps,
    # and a probe can only have one handler)
    tcpSocket: null
    exec:
      command:
        - sh
        - -c
        - |
          START_FILE=/tmp/.opensearch-reached-green
          if [ -f "$START_FILE" ]; then
            curl -sf -o /dev/null http://localhost:9200/
          else
            curl -sf -o /dev/null 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=1s' \
              && touch "$START_FILE"
          fi
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  ## IRSA web identity token, mounted inside the config dir so the
  ## repository-s3 plugin is allowed to read it under the security manager.
  ## AWS_ROLE_ARN is set in values-uchicago-private.yaml.
  extraVolumes:
    - name: aws-irsa-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 86400
              path: token
  extraVolumeMounts:
    - name: aws-irsa-token
      mountPath: /usr/share/opensearch/config/aws-irsa
      readOnly: true
