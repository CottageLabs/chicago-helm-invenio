## Chicago / UChicago deployment values
## Target: uchicago.cottagelabs.com / knowledge.uchicago.edu
## Cluster: chicago-invenio (us-east-2)

global:
  timezone: "America/Chicago"

## ECR registry and certificate ARN are in values-uchicago-private.yaml (gitignored).
image:
  repository: chicago-invenio
  tag: "3014d5d6bbfe27ad8e7bd635940abafdb4446643"
  pullPolicy: Always

ingress:
  enabled: true
  class: alb
  extraHosts:
    - uchicago.cottagelabs.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/tags: project=chicago-invenio

invenio:
  hostname: knowledge.uchicago.edu
  init: true
  sysadmin:
    email: sysadmin@cottagelabs.com
    passwordSecret: invenio-sysadmin-secret
  datacite:
    enabled: true
    prefix: "10.6082"
    testMode: false
    existingSecret: invenio-datacite-secret
    secretKeys:
      usernameKey: DATACITE_USERNAME
      passwordKey: DATACITE_PASSWORD
  extraConfig:
    # uchicago.cottagelabs.com is listed in ingress.extraHosts above.
    INVENIO_TRUSTED_HOSTS: '["knowledge.uchicago.edu", "uchicago.cottagelabs.com"]'
  extraEnvFrom:
    - secretRef:
        name: invenio-mail-secret
    - secretRef:
        name: invenio-oauth-secret
  sentry:
    enabled: true
    existingSecret: invenio-sentry-secret
  ## Recycle a uwsgi worker once its own RSS crosses these thresholds (in MB), so a
  ## worker that balloons during a heavy operation doesn't keep running at that size
  ## indefinitely. Without this, workers only recycle on max-requests (see
  ## uwsgi-configmap.yaml), which has no ceiling on memory between recycles -- this is
  ## what let individual web pods grow past their 4Gi request (to 5.5-7.3Gi observed)
  ## until the node evicted them under memory pressure.
  ## reload-on-rss: graceful, worker finishes its current request first.
  ## evil-reload-on-rss: set higher, as a hard backstop closer to the 8Gi container
  ## limit -- only kicks in if a worker somehow blows past the graceful threshold too.
  uwsgiExtraConfig:
    reload-on-rss: 2048
    evil-reload-on-rss: 3072

persistence:
  enabled: true
  storage_class: efs
  access_mode: ReadWriteMany
  size: 500G

terminal:
  enabled: true
  replicas: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  extraVolumes:
    - name: import-data-s3
      persistentVolumeClaim:
        claimName: import-data-s3
  extraVolumeMounts:
    - name: import-data-s3
      mountPath: /mnt/import-data

web:
  replicas: 4
  uwsgi:
    processes: 4
    threads: 2
  readinessProbe:
    failureThreshold: 5
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 5
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 6Gi

nginx:
  readinessProbe:
    failureThreshold: 5
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  replicas: 2
  concurrency: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

flower:
  enabled: false

postgresql:
  enabled: false

postgresqlExternal:
  port: 5432
  username: invenio
  database: invenio
  existingSecret: invenio-db-secret
  existingSecretPasswordKey: password

redis:
  enabled: false

redisExternal:
  hostname: ""  # set in values-uchicago-private.yaml

rabbitmq:
  enabled: false

rabbitmqExternal:
  hostname: invenio-mq.invenio.svc.cluster.local
  amqpPort: 5672
  managementPort: 15672
  protocol: amqp
  vhost: ""
  username: invenio
  existingSecret: invenio-mq-secret
  existingSecretPasswordKey: password

opensearch:
  enabled: true
  # "soft" (the chart default) only prefers spreading master pods across
  # nodes - the scheduler can still co-locate them under pressure. "hard"
  # requires it, so a single node failure can't take out a majority of the
  # master quorum at once.
  antiAffinity: "hard"
