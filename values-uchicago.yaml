## Chicago / UChicago deployment values
## Target: uchicago.cottagelabs.com
## Cluster: chicago-invenio (us-east-2)

global:
  timezone: "America/Chicago"

## ECR registry and certificate ARN are in values-uchicago-private.yaml (gitignored).
image:
  repository: chicago-invenio
  tag: "14f8471dbec1471da19e718d6ca980cd8a7d0f8f"
  pullPolicy: Always

ingress:
  enabled: true
  class: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/tags: project=chicago-invenio

invenio:
  hostname: uchicago.cottagelabs.com
  init: true
  sysadmin:
    email: sysadmin@cottagelabs.com
    passwordSecret: invenio-sysadmin-secret
  datacite:
    enabled: true
    prefix: "10.70047"
    testMode: true
    existingSecret: invenio-datacite-secret
    secretKeys:
      usernameKey: DATACITE_USERNAME
      passwordKey: DATACITE_PASSWORD
  extraEnvVars:
    - name: CHI_ENABLE_CURATIONS
      value: "true"
  extraEnvFrom:
    - secretRef:
        name: invenio-mail-secret
    - secretRef:
        name: invenio-oauth-secret

persistence:
  enabled: true
  storage_class: efs
  access_mode: ReadWriteMany
  size: 500G

terminal:
  enabled: true
  replicas: 0
  extraVolumeMounts:
    - name: shared-volume
      mountPath: /opt/invenio/var/instance/import-data
      subPath: import-data


web:
  replicas: 2
  uwsgi:
    processes: 2
    threads: 2
  extraVolumes:
    - name: basic-auth
      secret:
        secretName: invenio-basic-auth

worker:
  replicas: 2
  concurrency: 2

flower:
  enabled: false

nginx:
  # Basic auth is enabled for pre-production. Credentials are stored in the
  # invenio-basic-auth Kubernetes secret (not in this file).
  extraVolumeMounts:
    - name: basic-auth
      mountPath: /etc/nginx/auth
      readOnly: true
  extraServerConfig: |
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

postgresql:
  enabled: false

postgresqlExternal:
  port: 5432
  username: invenio
  database: invenio
  existingSecret: invenio-db-secret
  existingSecretPasswordKey: password

redis:
  enabled: false

redisExternal:
  hostname: ""  # set in values-uchicago-private.yaml

rabbitmq:
  enabled: false

rabbitmqExternal:
  hostname: invenio-mq.invenio.svc.cluster.local
  amqpPort: 5672
  managementPort: 15672
  protocol: amqp
  vhost: ""
  username: invenio
  existingSecret: invenio-mq-secret
  existingSecretPasswordKey: password

opensearch:
  enabled: true
