apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: invenio-mq
  namespace: invenio
spec:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    storage: 10Gi
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: invenio-mq-user
  namespace: invenio
spec:
  rabbitmqClusterReference:
    name: invenio-mq
  importCredentialsSecret:
    name: invenio-mq-secret
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: invenio-mq-permission
  namespace: invenio
spec:
  vhost: "/"
  userReference:
    name: invenio-mq-user
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: invenio-mq
